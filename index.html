<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Playwrite+RO:wght@300&family=Sora:wght@100..800&display=swap" rel="stylesheet">

    <title>devChallenges.io | Minimal Blog Card</title>

    <style>
      header{
        margin-bottom: -10px;
        margin-top: 10px;
        font-size: 18px;
        font-weight: 800;
      }
      
      .sora {
        color: #394150;
        font-family: "Sora", sans-serif;
        font-optical-sizing: auto;
        font-style: normal;
        font-size: 14px;
        font-weight: 400;
      }

      body {
        margin: 0%;
      }
      .wrapper{
        display: flex;
        justify-content: center;
        align-items: center;
        width: 20%;
        margin: 10% 40%;

      }
      .card{
        display: inline-block;
        padding: 16px;
        line-height: 1.6;
        border-radius: 5%;
        box-shadow: 8px 5px 16px #E5EAF0;
      }
      .card img{
        display: block;
        border-radius: 5%;
      }
    
      #tag{
        font-size: 10px;
        display: inline;
        background-color: #F2EAFD;
        color: #7C19EE;
        border-radius: 10px;
        padding: 2px 6px;

      }
      #annie{
        font-size: 12px;
      }
      hr{
        border: 1px solid #E5EAF0;
      }

    </style>
  </head>
  <body class="sora">

    <div class="wrapper">
      <div class="card">
        <img src="resources/Cactus.jpg" alt="no image">
        <br>
        <p id="tag"><b>Design</b></p>
        <header>Embracing Minimalism</header>
        <p>From minimalist sculptures to minimalist paintings, this blog will inspire you to appreciate the beauty that lies in simplicity.</p>
        <hr>
        <p id="annie">Annie Spratt</p>
      </div>
    </div>
  </body>
</html>
